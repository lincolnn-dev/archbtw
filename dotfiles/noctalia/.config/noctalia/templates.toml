# Dotfile-managed Noctalia templates (see App Theming docs).
# settings.toml remains GUI-managed; user templates live here.

[theme.templates.user.visor]
input_path  = "$XDG_CONFIG_HOME/noctalia/templates/visor.conf"
output_path = "$XDG_STATE_HOME/noctalia/visor-staging/noctalia.conf"
post_hook   = "staged=$HOME/.local/state/noctalia/visor-staging/noctalia.conf; esp=/boot/EFI/visor/themes/noctalia.conf; if [ -f \"$staged\" ] && { [ ! -f \"$esp\" ] || [ \"$staged\" -nt \"$esp\" ]; }; then (timeout 5 notify-send 'Visor theme staged' 'Run visor-sync to update the bootloader' &) || true; fi"
