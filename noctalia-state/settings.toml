config_version = 13

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.79999998211860657
    capsule_padding = 8.0
    enabled = true
    end = [
        "media",
        "tray",
        "notifications",
        "screenshot",
        "clipboard",
        "volume",
        "brightness",
        "control-center",
        "session"
    ]
    font_family = "JetBrainsMono Nerd Font"
    margin_ends = 700
    padding = 10
    position = "top"
    radius = 24
    shadow = false
    start = [ "launcher", "wallpaper", "workspaces", "wallhaven" ]
    thickness = 32

[brightness]
enable_ddcutil = true
minimum_brightness = 0.19999999552965164
sync_all_monitors = true

[control_center]
hidden_tabs = [ "network", "bluetooth" ]

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "noctalia/wallhaven:shortcut"

    [[control_center.shortcuts]]
    type = "clipboard"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 330.0

[location]
address = "Joinville"
sunrise = "07:30"
sunset = "20:30"

[lockscreen]
blur_intensity = 0.0
fingerprint = false
lock_before_suspend = false
